<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국몰드 AI 오피스</title>
  <meta name="description" content="한국몰드의 AI 직원들이 금형 업무를 처리하는 가상 사무실">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">HK</span>
      <div>
        <h1>한국몰드 AI 오피스</h1>
        <p class="sub">AI 직원 8명이 금형 업무를 처리하고 있어요</p>
      </div>
    </div>
    <div class="stats" aria-live="polite">
      <span class="stat"><span class="dot working"></span>업무 중 <b id="stat-working">0</b></span>
      <span class="stat"><span class="dot meeting"></span>회의 중 <b id="stat-meeting">0</b></span>
      <span class="stat"><span class="dot break"></span>휴식 <b id="stat-break">0</b></span>
      <span class="stat">오늘 완료 <b id="stat-done">0</b></span>
      <time id="clock" class="clock"></time>
    </div>
  </header>

  <div class="layout">
    <main class="floor" id="floor" aria-label="사무실 배치도"></main>

    <aside class="side">
      <section class="panel" id="detail" aria-live="polite"></section>
      <section class="panel">
        <h2>활동 기록</h2>
        <ol class="log" id="log"></ol>
      </section>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
